
<main class="verify-page">

  <div class="background-glow"></div>


  <div class="verify-container">


    <!-- =========================
         BRAND
    ========================== -->

    <a
      routerLink="/"
      class="brand">

      <span class="brand-icon">
        G
      </span>

      <span class="brand-name">
        GAME<span>ZONE</span>
      </span>

    </a>


    <!-- =========================
         VERIFY CARD
    ========================== -->

    <section class="verify-card">

      <div>


        <!-- MAIL ICON -->

        <span class="status-icon mail-icon">

          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="1" />

            <path
              d="m3 7 9 6 9-6" />

          </svg>

        </span>


        <!-- TITLE -->

        <p class="eyebrow">
          Bước cuối cùng
        </p>


        <h1>
          Kiểm tra hộp thư
        </h1>


        <p class="description">
          Chúng tôi đã gửi liên kết xác thực tài khoản đến:
        </p>


        <p class="email-address">
          example@gmail.com
        </p>


        <p class="sub-description instructions">
          Vui lòng mở email và nhấn vào liên kết xác thực
          trong vòng 10 phút. Nếu chưa thấy email, hãy kiểm
          tra thư mục spam.
        </p>


        <!-- =========================
             BACK TO LOGIN
        ========================== -->

        <div class="back-section">

          <a
            routerLink="/login"
            class="back-link">

            ← Đến đăng nhập

          </a>

        </div>


      </div>

    </section>

  </div>

</main>
