<div
    class="side-overlay"
    [class.open]="isSideNavOpen"
    (click)="toggleSideNav()">
</div>

<div
    class="sidebar"
    [class.open]="isSideNavOpen">
    <div class="sidebar-header">

        <div class="sidebar-logo">
            <i class="fa-solid fa-diamond"></i>
        </div>

        <div class="sidebar-brand">
            <span class="sidebar-title">
                <span class="sidebar-title-1">GAME</span>
                <span class="sidebar-title-2">ZONE</span>
            </span>

            <span class="sidebar-role">Admin</span>
        </div>
<div class="sidebar-close"
 (click)="toggleSideNav()">

    <i class="fa-solid fa-xmark"></i>
</div>

    </div>

    <nav class="sidebar-nav">

        <!-- Tổng quan -->
        <div class="sidebar-menu-item">
            <a
                routerLink="/dashboard"
                class="sidebar-menu-link"
                [class.active]="activeMenu === 'dashboard'"
                (click)="setActive('dashboard', $event)">

                <span class="sidebar-menu-active"></span>
                <span class="sidebar-menu-icon">📊</span>
                <span class="sidebar-menu-text">Tổng quan</span>

            </a>
        </div>


        <div class="sidebar-section">

            <p class="sidebar-section-title">
                Nội dung
            </p>


            <!-- Tin tức -->
            <div class="sidebar-menu-item">
                <a
                    routerLink="/news"
                    class="sidebar-menu-link"
                    [class.active]="activeMenu === 'news'"
                    (click)="setActive('news', $event)">

                    <span class="sidebar-menu-active"></span>
                    <span class="sidebar-menu-icon">📰</span>
                    <span class="sidebar-menu-text">Tin tức</span>

                </a>
            </div>


            <!-- Danh mục -->
            <div class="sidebar-menu-item">
                <a
                    routerLink="/category"
                    class="sidebar-menu-link"
                    [class.active]="activeMenu === 'category'"
                    (click)="setActive('category', $event)">

                    <span class="sidebar-menu-active"></span>
                    <span class="sidebar-menu-icon">🗂️</span>
                    <span class="sidebar-menu-text">Danh mục</span>

                </a>
            </div>


            <!-- Thẻ -->
            <div class="sidebar-menu-item">
                <a
                    routerLink="/tags"
                    class="sidebar-menu-link"
                    [class.active]="activeMenu === 'tag'"
                    (click)="setActive('tag', $event)">

                    <span class="sidebar-menu-active"></span>
                    <span class="sidebar-menu-icon">🏷️</span>
                    <span class="sidebar-menu-text">Thẻ</span>

                </a>
            </div>


            <!-- Bình luận -->
            <div class="sidebar-menu-item">
                <a
                    routerLink="/comment"
                    class="sidebar-menu-link"
                    [class.active]="activeMenu === 'comment'"
                    (click)="setActive('comment', $event)">

                    <span class="sidebar-menu-active"></span>
                    <span class="sidebar-menu-icon">💬</span>
                    <span class="sidebar-menu-text">Bình luận</span>

                </a>
            </div>

        </div>


        <!-- Hệ thống -->
        <div class="sidebar-section">

            <p class="sidebar-section-title">
                Hệ thống
            </p>


            <!-- Người dùng -->
            <div class="sidebar-menu-item">
                <a
                    routerLink="/users"
                    class="sidebar-menu-link"
                    [class.active]="activeMenu === 'user'"
                    (click)="setActive('user', $event)">

                    <span class="sidebar-menu-active"></span>
                    <span class="sidebar-menu-icon">👤</span>
                    <span class="sidebar-menu-text">Người dùng</span>

                </a>
            </div>

        </div>

    </nav>


    <div class="sidebar-footer">

        <div class="sidebar-footer-item">

            <a
                routerLink="/"
                class="sidebar-footer-link">

                <span class="sidebar-menu-icon">

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z"
                            stroke="#4A4540"
                            stroke-width="2"
                            stroke-linejoin="round"/>

                    </svg>

                </span>

                <span class="sidebar-footer-text">
                    Về trang chủ
                </span>

            </a>

        </div>

    </div>

</div>

<div class="header">

    <div class="header-left">
        <button type="button" class="header-menu-button"
         (click)="toggleSideNav()"
        >
            <span class="sidebar-menu-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6H20M4 12H20M4 18H20"
                          stroke="#4A4540"
                          stroke-width="2"
                          stroke-linecap="round"/>
                </svg>
            </span>
        </button>

        <span class="header-title">Admin</span>
    </div>

    <div class="header-right">
        <div class="header-avatar">A</div>

        <div class="header-user-info">
            <p class="header-role">admin</p>
            <p class="header-user-name">Lê Văn Thái</p>
        </div>
    </div>

</div>
