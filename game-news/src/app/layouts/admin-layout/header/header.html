<div
    class="side-overlay"
    [class.open]="isSideNavOpen"
    (click)="toggleSideNav()">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="sidebar"
    [class.open]="isSideNavOpen">

    <!-- SIDEBAR HEADER -->

    <div class="sidebar-header">

        <div class="sidebar-logo">
            <i class="fa-solid fa-diamond"></i>
        </div>


        <div class="sidebar-brand">

            <span class="sidebar-title">

                <span class="sidebar-title-1">
                    GAME
                </span>

                <span class="sidebar-title-2">
                    ZONE
                </span>

            </span>

            <span class="sidebar-role">
                Admin
            </span>

        </div>


        <!-- Nút đóng mobile -->

        <div
            class="sidebar-close"
            (click)="toggleSideNav()">

            <i class="fa-solid fa-xmark"></i>

        </div>

    </div>


    <!-- =================================================
         SIDEBAR NAVIGATION
    ================================================== -->

    <nav class="sidebar-nav">


        <!-- TỔNG QUAN -->

        <div class="sidebar-menu-item">

            <a
                routerLink="/admin/"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{
                    exact: true
                }"
                class="sidebar-menu-link"
                (click)="closeSideNav()">

                <span class="sidebar-menu-active"></span>

                <span class="sidebar-menu-icon">
                    📊
                </span>

                <span class="sidebar-menu-text">
                    Tổng quan
                </span>

            </a>

        </div>


        <!-- NỘI DUNG -->

        <div class="sidebar-section">

            <p class="sidebar-section-title">
                Nội dung
            </p>


            <!-- TIN TỨC -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/news"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link"
                    (click)="closeSideNav()">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        📰
                    </span>

                    <span class="sidebar-menu-text">
                        Tin tức
                    </span>

                </a>

            </div>


            <!-- DANH MỤC -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/category"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link"
                    (click)="closeSideNav()">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        🗂️
                    </span>

                    <span class="sidebar-menu-text">
                        Danh mục
                    </span>

                </a>

            </div>


            <!-- THẺ -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/tags"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link"
                    (click)="closeSideNav()">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        🏷️
                    </span>

                    <span class="sidebar-menu-text">
                        Thẻ
                    </span>

                </a>

            </div>


            <!-- BÌNH LUẬN -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/comment"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link"
                    (click)="closeSideNav()">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        💬
                    </span>

                    <span class="sidebar-menu-text">
                        Bình luận
                    </span>

                </a>

            </div>

        </div>


        <!-- HỆ THỐNG -->

        <div class="sidebar-section">

            <p class="sidebar-section-title">
                Hệ thống
            </p>


            <!-- NGƯỜI DÙNG -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/users"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link"
                    (click)="closeSideNav()">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        👤
                    </span>

                    <span class="sidebar-menu-text">
                        Người dùng
                    </span>

                </a>

            </div>


            <!-- HỒ SƠ -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/profile"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link"
                    (click)="closeSideNav()">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        ⚙
                    </span>

                    <span class="sidebar-menu-text">
                        Hồ sơ của tôi
                    </span>

                </a>

            </div>

        </div>

    </nav>


    <!-- =================================================
         SIDEBAR FOOTER
    ================================================== -->

    <div class="sidebar-footer">

        <div class="sidebar-footer-item">

            <a
                routerLink="/"
                class="sidebar-footer-link"
                (click)="closeSideNav()">

                <span class="sidebar-menu-icon">

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z"
                            stroke="#4A4540"
                            stroke-width="2"
                            stroke-linejoin="round"/>

                    </svg>

                </span>

                <span class="sidebar-footer-text">
                    Về trang chủ
                </span>

            </a>

        </div>

    </div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-left">

        <!-- NÚT 3 GẠCH -->

        <button
            type="button"
            class="header-menu-button"
            (click)="toggleSideNav()">

            <span class="sidebar-menu-icon">

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M4 6H20M4 12H20M4 18H20"
                        stroke="#4A4540"
                        stroke-width="2"
                        stroke-linecap="round"/>

                </svg>

            </span>

        </button>


        <span class="header-title">
            Admin
        </span>

    </div>


    <!-- =================================================
         USER
    ================================================== -->

    <div class="header-right">

        @if (user(); as currentUser) {

            <div class="header-avatar">

                {{ currentUser.username
                    ?.charAt(0)
                    ?.toUpperCase()
                }}

            </div>


            <div class="header-user-info">

                <p class="header-role">
                    {{ currentUser.role }}
                </p>

                <p class="header-user-name">
                    {{ currentUser.username }}
                </p>

            </div>

        }

    </div>

</div>
