<div class="sidebar">

    <!-- ============================== -->
    <!-- Header -->
    <!-- ============================== -->

    <div class="sidebar-header">

        <div class="sidebar-logo">
            <i class="fa-solid fa-diamond"></i>
        </div>

        <div class="sidebar-brand">

            <span class="sidebar-title">

                <span class="sidebar-title-1">
                    GAME
                </span>

                <span class="sidebar-title-2">
                    ZONE
                </span>

            </span>

            <span class="sidebar-role">
                Admin
            </span>

        </div>

    </div>


    <!-- ============================== -->
    <!-- Navigation -->
    <!-- ============================== -->

    <nav class="sidebar-nav">


        <!-- ========================== -->
        <!-- Tổng quan -->
        <!-- ========================== -->

        <div class="sidebar-menu-item">

            <a
                routerLink="/admin/"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{
                    exact: true
                }"
                class="sidebar-menu-link">

                <span class="sidebar-menu-active"></span>

                <span class="sidebar-menu-icon">
                    📊
                </span>

                <span class="sidebar-menu-text">
                    Tổng quan
                </span>

            </a>

        </div>


        <!-- ========================== -->
        <!-- Nội dung -->
        <!-- ========================== -->

        <div class="sidebar-section">

            <p class="sidebar-section-title">
                Nội dung
            </p>


            <!-- ====================== -->
            <!-- Tin tức -->
            <!-- ====================== -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/news"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        📰
                    </span>

                    <span class="sidebar-menu-text">
                        Tin tức
                    </span>

                </a>

            </div>


            <!-- ====================== -->
            <!-- Danh mục -->
            <!-- ====================== -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/category"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        🗂️
                    </span>

                    <span class="sidebar-menu-text">
                        Danh mục
                    </span>

                </a>

            </div>


            <!-- ====================== -->
            <!-- Thẻ -->
            <!-- ====================== -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/tags"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        🏷️
                    </span>

                    <span class="sidebar-menu-text">
                        Thẻ
                    </span>

                </a>

            </div>


            <!-- ====================== -->
            <!-- Bình luận -->
            <!-- ====================== -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/comment"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        💬
                    </span>

                    <span class="sidebar-menu-text">
                        Bình luận
                    </span>

                </a>

            </div>

        </div>


        <!-- ========================== -->
        <!-- Hệ thống -->
        <!-- ========================== -->

        <div class="sidebar-section">

            <p class="sidebar-section-title">
                Hệ thống
            </p>


            <!-- ====================== -->
            <!-- Người dùng -->
            <!-- ====================== -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/users"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        👤
                    </span>

                    <span class="sidebar-menu-text">
                        Người dùng
                    </span>

                </a>

            </div>


            <!-- ====================== -->
            <!-- Hồ sơ -->
            <!-- ====================== -->

            <div class="sidebar-menu-item">

                <a
                    routerLink="/admin/profile"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: false
                    }"
                    class="sidebar-menu-link">

                    <span class="sidebar-menu-active"></span>

                    <span class="sidebar-menu-icon">
                        ⚙
                    </span>

                    <span class="sidebar-menu-text">
                        Hồ sơ của tôi
                    </span>

                </a>

            </div>

        </div>

    </nav>


    <!-- ============================== -->
    <!-- Footer -->
    <!-- ============================== -->

    <div class="sidebar-footer">

        <div class="sidebar-footer-item">

            <a
                routerLink="/"
                class="sidebar-footer-link">

                <span class="sidebar-menu-icon">

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z"
                            stroke="#4A4540"
                            stroke-width="2"
                            stroke-linejoin="round"/>

                    </svg>

                </span>

                <span class="sidebar-footer-text">
                    Về trang chủ
                </span>

            </a>

        </div>

    </div>

</div>
